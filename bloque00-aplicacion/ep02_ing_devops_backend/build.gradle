plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id "org.sonarqube" version "7.1.0.6387"
    id 'info.solidsoft.pitest' version '1.19.0-rc.2'
    id 'org.springframework.cloud.contract' version '4.3.4'
    // ── Calidad de código ─────────────────────────────────────────────────
    id 'org.openrewrite.rewrite' version '7.32.0'   // arregla código automáticamente
    id 'com.diffplug.spotless' version '7.0.4'       // limpia formato
    id 'pmd'                                          // valida reglas estáticas
    id 'checkstyle'                                   // convenciones de programación
    id 'com.github.spotbugs' version '6.5.12'         // bugs potenciales en bytecode
    id 'io.gatling.gradle' version '3.16.0'           // pruebas de carga (rendimiento)
    id 'de.undercouch.download' version '5.7.0'       // descarga JMeter para pruebas de carga
}

group = 'cl.duocuc.ep02'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

// Forzar versiones seguras de dependencias con CVEs conocidos
// Spring Boot 3.5.3 trae Tomcat 10.1.42 — forzamos 10.1.54 (fix CVEs)
ext['tomcat.version'] = '10.1.60'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // PostgreSQL — driver de producción y desarrollo
    runtimeOnly 'org.postgresql:postgresql'
    // H2 solo para tests (no en runtime de la app)
    testRuntimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Cucumber - tests de aceptación
    testImplementation 'io.cucumber:cucumber-java:7.20.1'
    testImplementation 'io.cucumber:cucumber-spring:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'
    testImplementation 'org.junit.platform:junit-platform-suite:1.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-suite-engine:1.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'

    // Spring Cloud Contract - tests de contrato
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier:4.3.4'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    finalizedBy jacocoTestReport
}

// El task contractTest generado por Spring Cloud Contract también necesita
// el flag de Byte Buddy para funcionar con Java 21+
tasks.withType(Test).configureEach {
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// Orden: test → jacocoTestReport → jacocoTestCoverageVerification
jacocoTestCoverageVerification.dependsOn jacocoTestReport
check.dependsOn jacocoTestCoverageVerification

sonar {
    properties {
        // ProjectKey = {github_owner}_{repo_name} — debe coincidir con SonarCloud
        property "sonar.projectKey", "mauriciovelasquezduoc_202601_DOY0101-003D_sprintboot_gradle"
        property "sonar.organization", "mauriciovelasquezduoc"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "${project.buildDir}/reports/jacoco/test/jacocoTestReport.xml"
        // Excluir directorios que no son código fuente
        property "sonar.exclusions", ".github/**,k8s/**,docs/**"
        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java"
        // Rama de referencia para calcular "nuevo código" (Sonar way usa métricas new_*)
        property "sonar.newCode.referenceBranch", "main"
        property "sonar.qualitygate.wait", "false"
        property "sonar.qualitygate.timeout", "300"
    }
}

pitest {
    targetClasses         = ['cl.duocuc.ep02.*']
    targetTests           = ['cl.duocuc.ep02.*']
    junit5PluginVersion   = '1.2.1'
    mutationThreshold     = 80
    coverageThreshold     = 80
    outputFormats         = ['HTML', 'XML']
    timestampedReports    = false
    jvmArgs               = ['-Dnet.bytebuddy.experimental=true']
    threads               = 2
}

contracts {
    testFramework         = org.springframework.cloud.contract.verifier.config.TestFramework.JUNIT5
    baseClassForTests     = 'cl.duocuc.ep02.contract.AlumnoContractBase'
    contractsDslDir       = file('src/test/resources/contracts')
}

// ─────────────────────────────────────────────────────────────────────────────
// OPENREWRITE — Aplica recetas de refactoring automático
// Uso local:  ./gradlew rewriteRun   (aplica cambios)
//             ./gradlew rewriteDryRun (solo muestra qué cambiaría)
// ─────────────────────────────────────────────────────────────────────────────
rewrite {
    // Recetas activas: modernización Java + análisis estático
    // Nota: UpgradeSpringBoot_3_4 se excluye — el proyecto ya está en 3.4.5
    // y la receta genera código incorrecto en SecurityConfig (csrf::disable)
    activeRecipe(
        'org.openrewrite.java.migrate.UpgradeToJava21',
        'org.openrewrite.staticanalysis.CommonStaticAnalysis',
        'org.openrewrite.staticanalysis.UnnecessaryThrows',
        'org.openrewrite.staticanalysis.SimplifyBooleanExpression',
        'org.openrewrite.java.RemoveUnusedImports'
    )
    // Excluir código generado por Spring Cloud Contract
    exclusion(
        'build/generated-test-sources/**',
        'build/generated-sources/**'
    )
}

dependencies {
    // Recetas OpenRewrite (solo en tiempo de build, no en runtime)
    rewrite 'org.openrewrite.recipe:rewrite-migrate-java:3.31.0'
    rewrite 'org.openrewrite.recipe:rewrite-spring:6.13.0'
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis:2.15.0'
}

// ─────────────────────────────────────────────────────────────────────────────
// SPOTLESS — Formatea y limpia el código fuente
// Uso local:  ./gradlew spotlessApply  (aplica formato)
//             ./gradlew spotlessCheck  (solo verifica, falla si hay diferencias)
// ─────────────────────────────────────────────────────────────────────────────
spotless {
    java {
        // Paleta de reglas sin dependencia en APIs internas del JDK
        // (google-java-format requiere --add-exports en Java 21+, se evita aquí)
        importOrder('java', 'javax', 'org', 'com', '')   // orden de imports
        removeUnusedImports()                             // elimina imports sin usar
        trimTrailingWhitespace()                          // sin espacios al final
        leadingTabsToSpaces(4)                            // indentación 4 espacios
        endWithNewline()                                  // salto de línea al final
        // Excluir código generado
        targetExclude('build/generated-test-sources/**', 'build/generated-sources/**')
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// PMD — Análisis estático de reglas de calidad
// Uso local:  ./gradlew pmdMain   (analiza código principal)
//             ./gradlew pmdTest   (analiza código de tests)
// Los reportes quedan en: build/reports/pmd/
// ─────────────────────────────────────────────────────────────────────────────
pmd {
    toolVersion = '7.16.0'
    // Falla el build si PMD encuentra violaciones
    ignoreFailures = false
    // Conjuntos de reglas activos
    ruleSets = []   // limpiamos los defaults para usar solo los nuestros
    ruleSetFiles = files('config/pmd/ruleset.xml')
    // Genera reporte HTML y XML
    reportsDir = file("${buildDir}/reports/pmd")
}

tasks.withType(Pmd).configureEach {
    // No analizar código generado (Spring Cloud Contract, OpenRewrite)
    exclude '**/generated-test-sources/**'
    exclude '**/generated-sources/**'
    reports {
        xml.required = true
        html.required = true
    }
}

// contractTest es código GENERADO por Spring Cloud Contract: no se analiza
// (ni Checkstyle, ni PMD, ni SpotBugs), igual que se excluye en Spotless.
tasks.matching {
    it.name in ['checkstyleContractTest', 'pmdContractTest', 'spotbugsContractTest']
}.configureEach {
    enabled = false
}

// ─────────────────────────────────────────────────────────────────────────────
// TASK: codeQuality — Ejecuta los 3 checks en orden antes de compilar
// Orden: spotlessCheck → pmdMain → rewriteDryRun
// En CI se usa este task; localmente se puede usar rewriteRun + spotlessApply
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('codeQuality') {
    group = 'verification'
    description = 'Ejecuta Spotless, PMD y OpenRewrite (dry-run) antes de compilar'
    dependsOn 'spotlessCheck', 'pmdMain', 'rewriteDryRun'
}

// Asegurar que codeQuality corra antes de compilar en el ciclo normal
// Nota: spotlessCheck se ejecuta como parte del task codeQuality,
// pero NO se encadena a compileJava para no bloquear rewriteRun ni bootRun locales.
// En CI el job code-quality corre spotlessCheck explícitamente antes de build-and-test.

// ─────────────────────────────────────────────────────────────────────────────
// CHECKSTYLE — Convenciones de programación (equivalente al maven-checkstyle-plugin)
// Uso local:  ./gradlew checkstyleMain checkstyleTest
// Reporte:    build/reports/checkstyle/
// ─────────────────────────────────────────────────────────────────────────────
checkstyle {
    toolVersion = '11.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    // No analizar código generado (Spring Cloud Contract, OpenRewrite)
    exclude '**/generated-test-sources/**'
    exclude '**/generated-sources/**'
    reports {
        xml.required = true
        html.required = true
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// SPOTBUGS — Bugs potenciales en el bytecode (equivalente a spotbugs-maven-plugin)
// Uso local:  ./gradlew spotbugsMain spotbugsTest
// Reporte:    build/reports/spotbugs/
// ─────────────────────────────────────────────────────────────────────────────
spotbugs {
    toolVersion = '4.8.6'
    // Se usan los enums del plugin vía valueOf (no String ni acceso directo al
    // constante): el DSL de Gradle 8.x (imagen Docker) no coerciona String -> enum.
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/exclude.xml')
    ignoreFailures = false
    showStackTraces = true
    showProgress = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// GATLING — Pruebas de carga / rendimiento (equivalente a gatling-maven-plugin)
// Uso local:  ./gradlew gatlingRun   (requiere la app en http://localhost:8080)
// Simulación: src/gatling/java/cl/duocuc/ep02/AlumnosSimulation.java
// Reporte:    build/reports/gatling/
// ─────────────────────────────────────────────────────────────────────────────
gatling {
    // El plugin agrega automáticamente las dependencias de Gatling (Java DSL)
    includeMainOutput = false
}

// Gatling 3.16 requiere Netty 4.2, pero la gestión de dependencias de Spring Boot
// fuerza Netty 4.1 (sin io.netty.channel.IoOps). Se fija 4.2.x solo en las
// configuraciones de Gatling para no afectar a la aplicación.
configurations.matching { it.name.toLowerCase().startsWith('gatling') }.configureEach { cfg ->
    cfg.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.netty') {
            def name = details.requested.name
            if (name.startsWith('netty-tcnative')) {
                // tcnative usa su propio esquema de versiones (2.0.x)
                details.useVersion '2.0.84.Final'
            } else if (name.startsWith('netty-')) {
                details.useVersion '4.2.18.Final'
            }
        }
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// JMETER — Pruebas de carga (equivalente al perfil jmeter del pom.xml)
// Descarga Apache JMeter y ejecuta el plan src/test/jmeter/ep02.jmx
// Uso local:  ./gradlew jmeterTest   (requiere la app en http://localhost:8080)
// Resultado:  build/jmeter/results/results.jtl
// ─────────────────────────────────────────────────────────────────────────────
def jmeterVersion = '5.6.3'
def jmeterArchiveFile = layout.buildDirectory.file("jmeter/apache-jmeter-${jmeterVersion}.tgz")
def jmeterHomeDir = layout.buildDirectory.dir("jmeter/apache-jmeter-${jmeterVersion}")
def jmeterPlanFile = file('src/test/jmeter/ep02.jmx')

tasks.register('downloadJmeter', Download) {
    group = 'verification'
    description = 'Descarga Apache JMeter (${jmeterVersion})'
    src "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${jmeterVersion}.tgz"
    dest jmeterArchiveFile.get().asFile
    overwrite false
    onlyIfModified false
}

tasks.register('extractJmeter', Copy) {
    group = 'verification'
    description = 'Descomprime Apache JMeter'
    dependsOn 'downloadJmeter'
    from tarTree(resources.gzip(jmeterArchiveFile.get().asFile))
    into layout.buildDirectory.dir('jmeter')
}

tasks.register('jmeterTest', Exec) {
    group = 'verification'
    description = 'Ejecuta las pruebas de carga JMeter (requiere la app en localhost:8080)'
    dependsOn 'extractJmeter'
    def jmeterBin = new File(jmeterHomeDir.get().asFile, 'bin/jmeter')
    def resultsDir = layout.buildDirectory.dir('jmeter/results').get().asFile
    def resultsFile = new File(resultsDir, 'results.jtl')
    doFirst {
        resultsDir.mkdirs()
        resultsFile.delete()
    }
    commandLine jmeterBin.absolutePath,
            '-n',
            '-t', jmeterPlanFile.absolutePath,
            '-l', resultsFile.absolutePath
}

// codeQuality ahora incluye TODAS las etapas estáticas (Spotless, Checkstyle, PMD,
// SpotBugs y OpenRewrite), igual que el job "Calidad de código" del pipeline.
tasks.named('codeQuality') {
    dependsOn 'spotlessCheck', 'checkstyleMain', 'checkstyleTest',
              'pmdMain', 'pmdTest', 'spotbugsMain', 'spotbugsTest', 'rewriteDryRun'
}
