# docker-compose standalone del frontend
# Ejecutar tercero (despues de backend y DB): docker compose up -d
services:
  ep02-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ep02-frontend:latest
    container_name: ep02-frontend
    environment:
      BACKEND_HOST: ep02-backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - ep02-network

networks:
  ep02-network:
    external: true